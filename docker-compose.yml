services:
  db:
    image: postgres:16-alpine
    container_name: algoset_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: algoset_backend
    restart: always
    env_file: .env
    command: >
      sh -c "python wait_for_db.py &&
             python manage.py migrate &&
             python manage.py seed_algoset &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: algoset_frontend
    restart: always
    stdin_open: true
    tty: true
    env_file: .env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/jsconfig.json:/app/jsconfig.json
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
